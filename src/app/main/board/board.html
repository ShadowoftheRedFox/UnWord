<div class="flex flex-col gap-2 flex-nowrap">
    @for (line of tries; track line) {
    <div class="flex flex-row gap-2 flex-nowrap">
        @for (position of wordLength; track position) {
        <app-case [guess]="casesGuesses(line, position)" [revealed]="false" [position]="position" [line]="line" />
        }
    </div>
    }
</div>
